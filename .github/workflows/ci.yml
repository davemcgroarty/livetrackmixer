name: CI

on:
  push:
  pull_request:

jobs:
  analyzer:
    name: Analyzer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyzer/pyproject.toml
      - name: ffmpeg, for the M4A decoding tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e "analyzer[dev]"
      - name: Test
        run: python -m pytest analyzer -q
        env:
          DJMIX_ANALYZER_OUTPUT: ${{ runner.temp }}/analysis
      - name: Keep analysis output for the C++ contract tests
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: analysis-output
          path: ${{ runner.temp }}/analysis
          retention-days: 3

  app:
    name: App (${{ matrix.os }})
    needs: analyzer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Linux packages for JUCE
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev libxcomposite-dev libxrender-dev libgl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyzer/pyproject.toml
      - name: Install the analyzer, for the runner integration test
        shell: bash
        run: |
          pip install -e analyzer
          echo "DJMIX_DJANALYZE=$(python -c 'import shutil; print(shutil.which("djanalyze"))')" >> "$GITHUB_ENV"
      - name: Analysis output from the analyzer job
        uses: actions/download-artifact@v4
        with:
          name: analysis-output
          path: ${{ runner.temp }}/analysis
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          DJMIX_ANALYZER_OUTPUT: ${{ runner.temp }}/analysis
